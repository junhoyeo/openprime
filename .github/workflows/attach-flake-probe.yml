# THROWAWAY probe for issue #42 (attach-window flake). Not for main; deleted after use.
name: attach-flake-probe
on:
  push:
    branches: [ci/attach-flake-probe]
permissions:
  contents: read
jobs:
  probe:
    name: probe ${{ matrix.mode }} gap=${{ matrix.gap }} leg=${{ matrix.leg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: full-lib-stack, gap: "", leg: 1 }
          - { mode: full-lib-stack, gap: "", leg: 2 }
          - { mode: full-lib-stack, gap: "", leg: 3 }
          - { mode: full-lib-stack, gap: "", leg: 4 }
    env:
      DO_NOT_TRACK: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      TEST: worker::attach_window_tests::a_direct_attach_streams_an_event_emitted_while_its_snapshot_is_pending
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-shards
          save-if: false
      - name: Install gdb and stress-ng
        run: sudo apt-get install -y gdb stress-ng > /dev/null
      - name: Build the workspace bins and bootstrap the CI test kernel (as ci.yml)
        run: |
          set -euo pipefail
          python3 -m pip install --user uv > /dev/null
          export PATH="$HOME/.local/bin:$PATH"
          cargo build --locked --workspace --bins
          bootstrap_output="$(./target/debug/prime-agent --prime-agent-bootstrap)"
          printf '%s\n' "${bootstrap_output}" | tail -3
          runtime_script='{"responses":[{"content":[{"type":"toolCall","name":"python_repl","arguments":{"code":"import goal, agent_message\nprint(\"TEST_RUNTIME_\" + \"READY\")"}}]},{"text":"ready"}]}'
          DO_NOT_TRACK=1 PRIME_AGENT_FAUX_SCRIPT="${runtime_script}" \
            ./target/debug/prime-agent --mode json -p "prepare the test runtime" > "${RUNNER_TEMP}/test-runtime.jsonl"
          grep -qF TEST_RUNTIME_READY "${RUNNER_TEMP}/test-runtime.jsonl"
          kernel_python="$(python3 scripts/ci_test_runtime.py)"
          test -x "${kernel_python}"
          {
            echo "PRIME_AGENT_KERNEL_PYTHON=${kernel_python}"
            echo "PA_CORE_KERNEL_PYTHON=${kernel_python}"
            echo "PA_E2E_KERNEL_PYTHON=${kernel_python}"
            echo "PA_TEST_RUNTIME_ABI_PYTHON=${kernel_python}"
          } >> "${GITHUB_ENV}"
      - name: Build the pa-daemon lib test binary
        run: |
          set -euo pipefail
          cargo test --locked -p pa-daemon --lib --no-run --message-format=json \
            | python3 -c 'import sys,json
          for l in sys.stdin:
              try: m=json.loads(l)
              except Exception: continue
              if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["name"]=="pa_daemon" and "lib" in m["target"]["kind"]: print(m["executable"])' > "$RUNNER_TEMP/bin.txt"
          cat "$RUNNER_TEMP/bin.txt"
      - name: Loop the target
        env:
          ATTACH_PROBE_GAP_MS: ${{ matrix.gap }}
          MODE: ${{ matrix.mode }}
        run: |
          set +e
          set -uo pipefail
          bin="$(tail -1 "$RUNNER_TEMP/bin.txt")"
          nproc
          mkdir -p "$RUNNER_TEMP/stacks"
          export PROBE_STEP_BOUND_S=150
          pass=0; fail=0; dumped=0
          for i in $(seq 1 10); do
            log="$RUNNER_TEMP/run-$i.log"
            "$bin" > "$log" 2>&1 &
            pid=$!
            # A stall: libtest names the target at 60s while the holder still holds
            # the lock (bound 150s): stack every thread of the live process then.
            ( while kill -0 "$pid" 2>/dev/null; do
                if grep -qF "$TEST has been running for over 60 seconds" "$log"; then
                  sudo gdb -p "$pid" -batch -ex "thread apply all bt 30" > "$RUNNER_TEMP/stack-$i.txt" 2>&1
                  sudo cp "$RUNNER_TEMP/stack-$i.txt" "$RUNNER_TEMP/stacks/" 2>/dev/null
                  break
                fi
                sleep 1
              done ) &
            mon=$!
            wait "$pid"; rc=$?
            wait "$mon"
            target_line="$(grep -E "^test $TEST \.\.\." "$log" | grep -v running | head -1)"
            case "$target_line" in *" ok") pass=$((pass+1)); r=ok;; *FAILED) fail=$((fail+1)); r=FAIL;; *) r="OTHER";; esac
            echo "run $i $r :: $target_line"
            if [ -f "$RUNNER_TEMP/stack-$i.txt" ]; then
              echo "== stack of run $i (threads touching pa_daemon/core lock/epoll) =="
              python3 - "$RUNNER_TEMP/stack-$i.txt" <<'PY'
          import re, sys
          text = open(sys.argv[1], errors="replace").read()
          for block in re.split(r"\n(?=Thread \d+ )", text):
              head = block.split("\n", 1)[0]
              frames = [l for l in block.split("\n")[1:] if l.startswith("#")]
              keys = ("pa_daemon", "epoll_wait", "futex", "mutex", "Condvar", "park", "attach_window", "recv_timeout", "core::ops")
              hits = [re.sub(r"0x[0-9a-f]+ in ", "", f)[:170] for f in frames if any(k in f for k in keys)]
              if any("pa_daemon" in f or "epoll" in f for f in frames):
                  print(head[:120]); print("\n".join("   " + h for h in hits[:14]))
          PY
            fi
          done
          echo "RESULT mode=$MODE pass=$pass fail=$fail runs=10"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stacks-${{ matrix.leg }}
          path: ${{ runner.temp }}/stacks/
          if-no-files-found: ignore
