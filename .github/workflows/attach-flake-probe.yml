# THROWAWAY probe for issue #42 (attach-window flake). Not for main; deleted after use.
name: attach-flake-probe
on:
  push:
    branches: [ci/attach-flake-probe]
permissions:
  contents: read
jobs:
  probe:
    name: probe gap=${{ matrix.gap }} par=${{ matrix.par }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gap: "", par: 1 }
          - { gap: "20", par: 1 }
    env:
      DO_NOT_TRACK: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-shards
          save-if: false
      - name: Build the pa-daemon lib test binary
        run: |
          set -euo pipefail
          cargo test --locked -p pa-daemon --lib --no-run --message-format=json \
            | python3 -c 'import sys,json
          for l in sys.stdin:
              try: m=json.loads(l)
              except Exception: continue
              if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["name"]=="pa_daemon" and "lib" in m["target"]["kind"]: print(m["executable"])' > "$RUNNER_TEMP/bin.txt"
          cat "$RUNNER_TEMP/bin.txt"
      - name: Loop the test 50 times
        env:
          ATTACH_PROBE_GAP_MS: ${{ matrix.gap }}
        run: |
          set -uo pipefail
          bin="$(tail -1 "$RUNNER_TEMP/bin.txt")"
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          pass=0; fail=0
          for i in $(seq 1 50); do
            start=$(date +%s%N)
            if timeout 120 "$bin" --exact worker::attach_window_tests::a_direct_attach_streams_an_event_emitted_while_its_snapshot_is_pending --test-threads=1 > "$RUNNER_TEMP/run-$i.log" 2>&1; then
              pass=$((pass+1)); r=ok
            else
              fail=$((fail+1)); r=FAIL
            fi
            end=$(date +%s%N)
            echo "run $i $r $(( (end-start)/1000000 ))ms"
            if [ "$r" = FAIL ] && [ "$fail" -le 3 ]; then grep -E "panicked|SendError|left|right" "$RUNNER_TEMP/run-$i.log" | head -5; fi
          done
          echo "RESULT gap=${ATTACH_PROBE_GAP_MS:-none} pass=$pass fail=$fail"
