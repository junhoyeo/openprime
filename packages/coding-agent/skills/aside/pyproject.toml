[project]
name = "prime-agent-skill-aside"
version = "1.0.0"
description = "Drive the Aside Browser from the Prime Agent kernel: browser agent sessions, deterministic Playwright-style REPL automation, and screenshots."
requires-python = ">=3.10"
dependencies = []

# NOTE: deliberately no [project.scripts]. A console script named `aside` in the
# kernel venv would shadow the real Aside binary on PATH and make this wrapper
# recurse into itself. Call it from the kernel instead.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aside"]
