[project]
name = "prime-agent-skill-agent-sessions"
version = "0.1.0"
description = "Read coding-agent session transcripts and Aside chats and text artifacts from disk."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent_sessions = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sessions"]
